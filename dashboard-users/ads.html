<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعلانات — سوق غزة</title>
<script src="auth/auth-api.js"></script>
<script src="auth/auth-guard.js"></script>
<link rel="stylesheet" href="../css/user-dashboard.css">
</head>
<body data-page="ads">
<script>(function(){try{if(localStorage.getItem('gaza-market-dashboard-theme')==='dark'){document.body.classList.add('dark-mode');}}catch(e){}})();</script>

  <div id="topnav-slot"></div>

  <aside class="side-panel">
    <div id="topbar-slot"></div>
    <div id="sidebar-slot"></div>
  </aside>

  <div class="app-shell">
    <main class="app-main">

      <button class="mobile-menu-btn" data-action="open-sidebar" aria-label="فتح القائمة">
        <i data-lucide="menu" class="icon"></i>
      </button>

      <div class="app-content">

        <div class="page-head">
          <div>
            <div class="page-title">الإعلانات</div>
            <div class="page-subtitle">فعاليات، ورش، وظائف، عروض تظهر في صفحة مساحتك</div>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-primary" data-action="open-ad-add">
              <i data-lucide="plus" class="icon"></i> إعلان
            </button>
          </div>
        </div>

        <div id="ads-data-wrap" style="display:none;">

          <div class="card card-pad" id="ads-table-card">
            <div class="table-wrap" id="ads-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>العنوان</th>
                    <th>النوع</th>
                    <th>التاريخ</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                  </tr>
                </thead>
                <tbody id="ads-table-body"></tbody>
              </table>
            </div>
          </div>

        </div>

        <div class="card card-pad empty-state" id="ads-empty-state">
          <i data-lucide="megaphone" class="icon"></i>
          <div class="title">لا توجد إعلانات بعد</div>
          <div class="sub">انشر فعالية أو ورشة أو وظيفة أو عرضاً لمساحتك</div>
        </div>

      </div>
    </main>
  </div>

  <div id="ad-edit-slot"></div>
  <div id="prices-edit-slot"></div>
  <div id="services-edit-slot"></div>

  <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js"></script>
  <script src="../js/store-type-config.js"></script>
  <script src="../js/usere-dashboard.js"></script>
</body>
</html>
