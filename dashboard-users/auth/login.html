<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — سوق غزة</title>
<link rel="stylesheet" href="../../css/user-dashboard.css">
<link rel="stylesheet" href="auth.css">
</head>
<body data-page="login">

  <button type="button" class="icon-btn auth-theme-toggle" data-action="toggle-theme" aria-label="التبديل إلى الوضع الليلي">
    <i data-lucide="moon" class="icon"></i>
  </button>

  <main class="auth-page">
    <div class="auth-shell">

      <div class="auth-brand">
        <div class="auth-logo">غ</div>
        <h1 class="auth-title">الدخول إلى لوحة التحكم</h1>
        <p class="auth-subtitle">سوق غزة · تسجيل الدخول</p>
      </div>

      <div class="card auth-card">

        <div class="auth-alert" id="login-alert" role="alert" hidden>
          <i data-lucide="alert-circle" class="icon"></i>
          <span id="login-alert-text"></span>
        </div>

        <form id="login-form" novalidate>

          <div class="field" id="login-whatsapp-field">
            <label for="login-whatsapp">رقم الواتساب</label>
            <div class="auth-input-wrap">
              <i data-lucide="message-circle" class="icon auth-input-icon"></i>
              <input
                type="tel"
                id="login-whatsapp"
                name="whatsapp"
                class="auth-input-ltr"
                inputmode="numeric"
                autocomplete="username"
                dir="ltr"
                placeholder="972597******"
              >
            </div>
            <div class="hint">اكتب الرقم بدءاً برمز الدولة (972 أو 970) بدون علامة +</div>
            <div class="field-error" id="login-whatsapp-error"></div>
          </div>

          <div class="field" id="login-password-field">
            <div class="auth-label-row">
              <label for="login-password">كلمة المرور</label>
              <a href="forgot-password.html" class="auth-link">نسيت كلمة المرور؟</a>
            </div>
            <div class="auth-input-wrap">
              <i data-lucide="lock" class="icon auth-input-icon"></i>
              <input
                type="password"
                id="login-password"
                name="password"
                class="auth-input-ltr"
                autocomplete="current-password"
                dir="ltr"
                placeholder="••••••••"
              >
              <button type="button" class="icon-btn auth-input-action" data-action="toggle-password" data-target="login-password" aria-label="إظهار كلمة المرور">
                <i data-lucide="eye" class="icon"></i>
              </button>
            </div>
            <div class="field-error" id="login-password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary auth-submit" id="login-submit">
            <i data-lucide="log-in" class="icon"></i> تسجيل الدخول
          </button>

        </form>
      </div>

      <p class="auth-footnote">لأصحاب الأماكن وفريق العمل المسجلين فقط</p>

    </div>
  </main>

  <script src="../../js/vendor/lucide.min.js"></script>
  <script src="auth-api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
