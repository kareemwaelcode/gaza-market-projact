<div class="pep-scrim" id="sve-scrim" data-action="close-services-edit"></div>

<aside class="pep-panel" id="sve-panel">
  <div class="pep-header">
    <div>
      <h3 class="pep-title">الخدمات المتاحة</h3>
      <div class="pep-subtitle">فعّل الخدمات المتوفرة في مساحتك</div>
    </div>
    <button type="button" class="icon-btn" data-action="close-services-edit" aria-label="إغلاق">
      <i data-lucide="x" class="icon"></i>
    </button>
  </div>

  <div class="pep-body">

    <div class="sve-row">
      <div class="switch" id="sve-switch-wifi"></div>
      <span class="sve-row-label">WiFi</span>
      <input type="text" id="sve-details-wifi" class="sve-details-input" placeholder="تفاصيل إضافية (اختياري)...">
    </div>

    <div class="sve-row">
      <div class="switch" id="sve-switch-electricity"></div>
      <span class="sve-row-label">كهرباء</span>
      <input type="text" id="sve-details-electricity" class="sve-details-input" placeholder="تفاصيل إضافية (اختياري)...">
    </div>

    <div class="sve-row">
      <div class="switch" id="sve-switch-printing"></div>
      <span class="sve-row-label">طباعة</span>
      <input type="text" id="sve-details-printing" class="sve-details-input" placeholder="تفاصيل إضافية (اختياري)...">
    </div>

    <div class="sve-row">
      <div class="switch" id="sve-switch-screens"></div>
      <span class="sve-row-label">شاشات</span>
      <input type="text" id="sve-details-screens" class="sve-details-input" placeholder="تفاصيل إضافية (اختياري)...">
    </div>

    <div class="sve-row">
      <div class="switch" id="sve-switch-private_rooms"></div>
      <span class="sve-row-label">غرف خاصة</span>
      <input type="text" id="sve-details-private_rooms" class="sve-details-input" placeholder="تفاصيل إضافية (اختياري)...">
    </div>

    <div class="sve-row">
      <div class="switch" id="sve-switch-drinks"></div>
      <span class="sve-row-label">مشروبات</span>
      <input type="text" id="sve-details-drinks" class="sve-details-input" placeholder="تفاصيل إضافية (اختياري)...">
    </div>

  </div>

  <div class="pep-footer">
    <button type="button" class="btn btn-primary" id="sve-save-btn">حفظ الخدمات</button>
  </div>
</aside>
